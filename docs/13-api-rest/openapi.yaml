openapi: 3.0.3
info:
  title: API REST - Sistema de Encuestas
  description: Documentación de los endpoints para la gestión de encuestas, preguntas, respuestas y resultados.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
    description: Servidor principal

security: []

paths:
  /encuestas:
    get:
      summary: Obtiene las encuestas disponibles
      operationId: getEncuestas
      parameters:
        - name: estado
          in: query
          description: Filtra por estado
          required: false
          schema:
            type: string
            enum: [borrador, publicada, cerrada]
        - name: page
          in: query
          description: Número de página
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Tamaño de página
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de encuestas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncuestaResumen'
        '400':
          $ref: '#/components/responses/400BadRequest'

    post:
      summary: Crea una nueva encuesta
      operationId: createEncuesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncuestaInput'
      responses:
        '201':
          description: Encuesta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaResumen'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /encuestas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    get:
      summary: Obtiene los datos de una encuesta específica
      operationId: getEncuestaById
      responses:
        '200':
          description: Datos de la encuesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaDetalle'
        '404':
          $ref: '#/components/responses/404NotFound'

    put:
      summary: Modifica una encuesta existente
      operationId: updateEncuesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncuestaInput'
      responses:
        '200':
          description: Encuesta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncuestaDetalle'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

    delete:
      summary: Elimina una encuesta
      operationId: deleteEncuesta
      responses:
        '204':
          description: Eliminada sin contenido de respuesta
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /encuestas/{id}/publicar:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    put:
      summary: Cambia el estado de la encuesta a publicada
      operationId: publicarEncuesta
      responses:
        '200':
          description: Encuesta publicada
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /encuestas/{id}/cerrar:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    put:
      summary: Cambia el estado de la encuesta a cerrada
      operationId: cerrarEncuesta
      responses:
        '200':
          description: Encuesta cerrada
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /encuestas/{id}/preguntas:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    post:
      summary: Agrega una pregunta a una encuesta
      operationId: addPregunta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaInput'
      responses:
        '201':
          description: Pregunta creada
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /encuestas/{id}/respuestas:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    post:
      summary: Registra las respuestas de un participante
      operationId: submitRespuestas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespuestaParticipanteInput'
      responses:
        '201':
          description: Respuestas registradas
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /encuestas/{id}/resultados:
    parameters:
      - name: id
        in: path
        required: true
        description: ID de la encuesta
        schema:
          type: integer

    get:
      summary: Consulta los resultados agregados de una encuesta
      operationId: getResultados
      responses:
        '200':
          description: Resultados de la encuesta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadosEncuesta'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  schemas:
    EncuestaInput:
      type: object
      required:
        - titulo
      properties:
        titulo:
          type: string
          example: "Satisfacción del cliente"
        descripcion:
          type: string
          example: "Encuesta trimestral de satisfacción"

    EncuestaResumen:
      type: object
      properties:
        id:
          type: integer
          example: 1
        titulo:
          type: string
          example: "Satisfacción del cliente"
        estado:
          type: string
          enum: [borrador, publicada, cerrada]
          example: "publicada"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-08-01T10:00:00Z"

    EncuestaDetalle:
      allOf:
        - $ref: '#/components/schemas/EncuestaResumen'
        - type: object
          properties:
            descripcion:
              type: string
            preguntas:
              type: array
              items:
                $ref: '#/components/schemas/Pregunta'

    PreguntaInput:
      type: object
      required:
        - enunciado
        - tipo
      properties:
        enunciado:
          type: string
          example: "¿Cómo calificarías el servicio?"
        tipo:
          type: string
          example: "opcion_multiple"
        opciones:
          type: array
          items:
            type: string
          example: ["Malo", "Regular", "Bueno", "Excelente"]

    Pregunta:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/PreguntaInput'

    RespuestaItem:
      type: object
      required:
        - preguntaId
        - valor
      properties:
        preguntaId:
          type: integer
          example: 1
        valor:
          type: string
          example: "Bueno"

    RespuestaParticipanteInput:
      type: object
      required:
        - participanteId
        - respuestas
      properties:
        participanteId:
          type: string
          example: "anon-8f3a"
        respuestas:
          type: array
          items:
            $ref: '#/components/schemas/RespuestaItem'

    ResultadoOpcion:
      type: object
      properties:
        opcion:
          type: string
          example: "Bueno"
        cantidad:
          type: integer
          example: 65
        porcentaje:
          type: number
          format: float
          example: 54.2

    ResultadoPregunta:
      type: object
      properties:
        preguntaId:
          type: integer
          example: 1
        enunciado:
          type: string
          example: "¿Cómo calificarías el servicio?"
        resultados:
          type: array
          items:
            $ref: '#/components/schemas/ResultadoOpcion'

    ResultadosEncuesta:
      type: object
      properties:
        encuestaId:
          type: integer
          example: 1
        totalParticipantes:
          type: integer
          example: 120
        preguntas:
          type: array
          items:
            $ref: '#/components/schemas/ResultadoPregunta'

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Descripción detallada del error"

  responses:
    400BadRequest:
      description: Body o parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflicto con el estado o reglas de negocio del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
